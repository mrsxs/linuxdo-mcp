[project]
name = "linuxdo-mcp"
version = "0.3.0"
description = "MCP server for searching and reading linux.do (Discourse)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<3",
    "anyio>=4",
    "curl_cffi>=0.7",
    "websockets>=13",
    "cryptography>=42",
    "pycookiecheat>=0.8",
]

[project.scripts]
linuxdo-mcp = "linuxdo_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linuxdo_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
